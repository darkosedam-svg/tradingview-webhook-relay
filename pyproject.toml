[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingview-webhook-relay"
version = "1.0.0"
description = "FastAPI relay from TradingView alerts to exchange orders — risk filters plus a dry-run backend; no live exchange backend yet"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Darko Vlahovic", email = "jessuskrist84@gmail.com" }
]
keywords = ["tradingview", "webhook", "fastapi", "trading", "crypto", "hyperliquid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.25",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
tv-relay = "tv_relay.server:main"

[project.urls]
Homepage = "https://github.com/darkosedam-svg/tradingview-webhook-relay"
Repository = "https://github.com/darkosedam-svg/tradingview-webhook-relay"
Issues = "https://github.com/darkosedam-svg/tradingview-webhook-relay/issues"

[tool.hatch.build.targets.wheel]
packages = ["tv_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
